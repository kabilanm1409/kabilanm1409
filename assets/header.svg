<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.08"/>
      <circle cx="30" cy="0" r="1" fill="#00E5FF" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Ubuntu', sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 4px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 2px;
      fill: #00E5FF;
    }
    .tagline-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 13.5px;
      letter-spacing: 1px;
      fill: #9CA3AF;
    }
    .status-text {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #10B981;
    }
    .bracket {
      fill: #7C3AED;
      font-weight: 700;
    }
  </style>

  <!-- Background Base -->
  <rect width="950" height="240" rx="16" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Overlay -->
  <rect width="950" height="240" rx="16" fill="url(#cyberGrid)"/>

  <!-- Glowing Outer Border -->
  <rect x="2" y="2" width="946" height="236" rx="14" fill="none" stroke="url(#cyanPurple)" stroke-width="1.8" stroke-opacity="0.65"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="70" r="90" fill="#00E5FF" opacity="0.07" filter="url(#glow)"/>
  <circle cx="830" cy="170" r="110" fill="#7C3AED" opacity="0.08" filter="url(#glow)"/>

  <!-- Corner Tech Brackets -->
  <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 930 45 L 930 20 L 905 20" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 20 195 L 20 220 L 45 220" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 930 195 L 930 220 L 905 220" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Decorative Circuit Nodes Left -->
  <g opacity="0.4">
    <line x1="50" y1="90" x2="110" y2="90" stroke="#00E5FF" stroke-width="1.2"/>
    <line x1="110" y1="90" x2="135" y2="115" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="135" cy="115" r="3.5" fill="#00E5FF"/>
    <circle cx="50" cy="90" r="2.5" fill="#00E5FF"/>
    
    <line x1="50" y1="150" x2="95" y2="150" stroke="#7C3AED" stroke-width="1.2"/>
    <line x1="95" y1="150" x2="120" y2="125" stroke="#7C3AED" stroke-width="1.2"/>
    <circle cx="120" cy="125" r="3.5" fill="#7C3AED"/>
  </g>

  <!-- Decorative Circuit Nodes Right -->
  <g opacity="0.4">
    <line x1="900" y1="90" x2="840" y2="90" stroke="#7C3AED" stroke-width="1.2"/>
    <line x1="840" y1="90" x2="815" y2="115" stroke="#7C3AED" stroke-width="1.2"/>
    <circle cx="815" cy="115" r="3.5" fill="#7C3AED"/>
    <circle cx="900" cy="90" r="2.5" fill="#7C3AED"/>

    <line x1="900" y1="150" x2="855" y2="150" stroke="#00E5FF" stroke-width="1.2"/>
    <line x1="855" y1="150" x2="830" y2="125" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="830" cy="125" r="3.5" fill="#00E5FF"/>
  </g>

  <!-- Status Pill Header -->
  <g transform="translate(475, 42)">
    <rect x="-115" y="-12" width="230" height="24" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <circle cx="-95" cy="0" r="4" fill="#10B981" filter="url(#softGlow)"/>
    <text x="-80" y="4" class="status-text">SYSTEM STATUS : ONLINE</text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(475, 105)" text-anchor="middle">
    <text class="title-text" filter="url(#softGlow)">
      <tspan class="bracket">&lt; </tspan>KABILAN M<tspan class="bracket"> /&gt;</tspan>
    </text>
  </g>

  <!-- Animated Glowing Divider Line -->
  <g transform="translate(475, 130)">
    <line x1="-240" y1="0" x2="240" y2="0" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#00E5FF"/>
  </g>

  <!-- Subtitle / Role -->
  <g transform="translate(475, 163)" text-anchor="middle">
    <text class="subtitle-text">
      JAVA DEVELOPER  •  CYBERSECURITY &amp; NETWORKING  •  AI SYSTEMS
    </text>
  </g>

  <!-- Bottom Tagline -->
  <g transform="translate(475, 195)" text-anchor="middle">
    <text class="tagline-text">
      ⚡ Turning ideas into high-impact, practical working systems
    </text>
  </g>
</svg>
